# Builds the Windows package and publishes it as a GitHub release when a version tag is pushed:
#   git tag v0.1.0 && git push origin v0.1.0     (or: GitHub website -> Releases -> Draft a new release -> new tag)
# If a build failed: fix, push, then Actions -> release -> Run workflow with the same tag.
# The release gets WFVendorOverlay-windows.zip and WFVendorOverlay-windows.zip.sha256, which the program's
# built-in updater downloads and verifies.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:                # Actions tab -> release -> Run workflow: builds an existing tag again
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.1.0)"
        required: true
env:
  TAG: ${{ startsWith(inputs.tag || github.ref_name, 'v') && (inputs.tag || github.ref_name) || format('v{0}', inputs.tag) }}   # 0.1.0 is accepted as v0.1.0
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Environment
        shell: powershell
        run: |
          py -3.12 -m venv .venv
          .venv\Scripts\python -m pip install --upgrade pip
          .venv\Scripts\python -m pip install -r requirements.txt
      - name: Check the tag matches version.py
        shell: powershell
        run: |
          $v = (.venv\Scripts\python -c "from version import __version__; print(__version__)").Trim()
          if ("v$v" -ne $env:TAG) { throw "tag $env:TAG does not match version.py ($v)" }
      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1
      - name: Package
        shell: powershell
        run: |
          Compress-Archive -Path dist\WFVendorOverlay\* -DestinationPath WFVendorOverlay-windows.zip
          $h = (Get-FileHash WFVendorOverlay-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$h  WFVendorOverlay-windows.zip" | Out-File -Encoding ascii WFVendorOverlay-windows.zip.sha256
      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"      # gh writes to stderr when the release does not exist yet: not an error
          $tag = $env:TAG
          gh release view $tag 2>&1 | Out-Null
          if ($LASTEXITCODE -eq 0) {
            # the release already exists (created on the website): just attach the files
            gh release upload $tag WFVendorOverlay-windows.zip WFVendorOverlay-windows.zip.sha256 --clobber
          } else {
            gh release create $tag WFVendorOverlay-windows.zip WFVendorOverlay-windows.zip.sha256 --title $tag --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { exit 1 }
